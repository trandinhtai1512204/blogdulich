services:
  - type: web
    name: blogdulich-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx -y prisma@5.22.0 db execute --file prisma/add-community-posts.sql --schema prisma/schema.prisma && npx -y prisma@5.22.0 db execute --file prisma/migrate-add-faqs.sql --schema prisma/schema.prisma && npx -y prisma@5.22.0 db execute --file prisma/migrate-add-supporting-articles.sql --schema prisma/schema.prisma && npx -y prisma@5.22.0 generate && npm run build
    startCommand: node dist/src/main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
